<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MindFlow - Workload & Wellbeing</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5F3FF" />
    <meta name="description" content="Personal Workload and Wellbeing Manager. Track perceived stress, demand, and resources with AI insights." />
    <!-- Google Fonts: Outfit (Sans) and Playfair Display (Editorial Serif from reference) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body, html, #root {
        height: 100%;
        width: 100%;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #F8F9FE;
        color: #1E293B;
        overflow-x: hidden;
      }
      .serif-title {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
        letter-spacing: -0.02em;
      }
      .aesthetic-caption {
        font-size: 11.5px;
        color: #78716C;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      /* Custom scrollbar & hide-scrollbar utility */
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(167, 139, 250, 0.35);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(167, 139, 250, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
